services:
  nginx:
    restart: always
    image: nginx:1.27-alpine
    container_name: ${PROJECT_NAME}_nginx
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./backend:/backend
      - ./backend/media:/media
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - project-network
  web:
    restart: always
    build: .
    image: ${PROJECT_NAME}_project:latest
    container_name: ${PROJECT_NAME}_app
    env_file: ./.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/backend
      - ./backend/media:/media
    expose:
      - '8000'
    links:
      - redis
    networks:
      - project-network
  worker:
    restart: always
    build: .
    image: ${PROJECT_NAME}_project:latest
    container_name: ${PROJECT_NAME}_worker
    env_file: ./.env
    command: celery -A config.celery_worker worker -l info
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/backend
      - ./backend/media:/media
    links:
      - redis
    networks:
      - project-network
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_db
    networks:
      - project-network
    env_file: ./.env
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - project-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PROJECT_NAME}_db_admin
    env_file: ./.env
    environment:
      PGADMIN_LISTEN_PORT: '5050'
    expose:
      - '5050'
    ports:
      - '${PGADMIN_PORT:-5050}:5050'
    depends_on:
      - db
    networks:
      - project-network
  flower:
    image: mher/flower
    container_name: ${PROJECT_NAME}_flower
    env_file: ./.env
    depends_on:
      - redis
    ports:
      - '${FLOWER_HOST_PORT:-8888}:${FLOWER_PORT:-8888}'
    networks:
      - project-network
networks:
  project-network:
    name: ${PROJECT_NAME}-network
